<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MeMark - Reset Password</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0066cc 0%, #004c99 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      max-width: 450px;
      width: 100%;
      padding: 48px;
    }

    .logo {
      text-align: center;
      margin-bottom: 32px;
    }

    .logo-text {
      font-size: 32px;
      font-weight: 700;
      color: #0066cc;
    }

    h1 {
      font-size: 28px;
      color: #1a1a1a;
      margin-bottom: 8px;
      text-align: center;
    }

    .subtitle {
      color: #666;
      text-align: center;
      margin-bottom: 32px;
      font-size: 15px;
      line-height: 1.5;
    }

    label {
      display: block;
      font-weight: 600;
      color: #1a1a1a;
      margin-bottom: 8px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #e1e4e8;
      border-radius: 12px;
      font-size: 15px;
      transition: all 0.2s;
      margin-bottom: 20px;
    }

    input:focus {
      outline: none;
      border-color: #0066cc;
      box-shadow: 0 0 0 3px rgba(0, 102, 204, 0.1);
    }

    button {
      width: 100%;
      background: #0066cc;
      color: white;
      border: none;
      padding: 16px 24px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    button:hover:not(:disabled) {
      background: #0052a3;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 102, 204, 0.4);
    }

    button:disabled {
      background: #ccc;
      cursor: not-allowed;
      transform: none;
    }

    .alert {
      padding: 14px 16px;
      border-radius: 12px;
      margin-bottom: 20px;
      font-size: 14px;
      line-height: 1.5;
      font-weight: 500;
    }

    .alert-success {
      background: #d4edda;
      color: #155724;
      border-left: 4px solid #28a745;
    }

    .alert-error {
      background: #f8d7da;
      color: #721c24;
      border-left: 4px solid #dc3545;
    }

    .alert-info {
      background: #d1ecf1;
      color: #0c5460;
      border-left: 4px solid #17a2b8;
    }

    .hidden {
      display: none;
    }

    .success-icon {
      text-align: center;
      font-size: 64px;
      margin-bottom: 24px;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 24px;
      color: #0066cc;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    .password-requirements {
      background: #f8f9fa;
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 13px;
      color: #666;
      border-left: 3px solid #0066cc;
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="resetForm">
      <div class="logo">
        <div class="logo-text">MeMark</div>
      </div>

      <h1>Reset Your Password</h1>
      <p class="subtitle">
        Enter your email and new password below to reset your password immediately.
      </p>

      <div id="result"></div>

      <label for="email">Email Address</label>
      <input
        type="email"
        id="email"
        placeholder="matthewjohnson22687@gmail.com"
        value="matthewjohnson22687@gmail.com"
        autocomplete="email"
      >

      <label for="newPassword">New Password</label>
      <input
        type="password"
        id="newPassword"
        placeholder="Enter new password"
        autocomplete="new-password"
      >

      <label for="confirmPassword">Confirm Password</label>
      <input
        type="password"
        id="confirmPassword"
        placeholder="Confirm new password"
        autocomplete="new-password"
      >

      <div class="password-requirements">
        Password must be at least 6 characters long
      </div>

      <button id="resetBtn" onclick="resetPassword()">Reset Password</button>
    </div>

    <div id="successScreen" class="hidden">
      <div class="success-icon">✅</div>
      <h1>Password Reset Complete!</h1>
      <p class="subtitle">
        Your password has been successfully reset.<br>
        You can now log in with your new password.
      </p>
      <a href="/" class="back-link">Go to Login →</a>
    </div>
  </div>

  <script>
    async function resetPassword() {
      const email = document.getElementById('email').value.trim();
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const resultDiv = document.getElementById('result');
      const btn = document.getElementById('resetBtn');

      resultDiv.innerHTML = '';

      if (!email) {
        resultDiv.innerHTML = '<div class="alert alert-error">Please enter your email address</div>';
        return;
      }

      if (!newPassword || !confirmPassword) {
        resultDiv.innerHTML = '<div class="alert alert-error">Please fill in all password fields</div>';
        return;
      }

      if (newPassword.length < 6) {
        resultDiv.innerHTML = '<div class="alert alert-error">Password must be at least 6 characters long</div>';
        return;
      }

      if (newPassword !== confirmPassword) {
        resultDiv.innerHTML = '<div class="alert alert-error">Passwords do not match</div>';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Resetting Password...';
      resultDiv.innerHTML = '<div class="alert alert-info">Resetting your password...</div>';

      try {
        const response = await fetch('https://ckhzhabcvxyawhjcjsfu.supabase.co/functions/v1/admin-reset-password', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            email: email,
            newPassword: newPassword
          })
        });

        const data = await response.json();

        if (response.ok && data.success) {
          document.getElementById('resetForm').classList.add('hidden');
          document.getElementById('successScreen').classList.remove('hidden');
        } else {
          resultDiv.innerHTML = `<div class="alert alert-error"><strong>Error:</strong> ${data.error || 'Failed to reset password'}</div>`;
          btn.disabled = false;
          btn.textContent = 'Reset Password';
        }
      } catch (err) {
        resultDiv.innerHTML = `<div class="alert alert-error"><strong>Error:</strong> ${err.message || 'Network error. Please try again.'}</div>`;
        btn.disabled = false;
        btn.textContent = 'Reset Password';
      }
    }

    document.getElementById('email').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        document.getElementById('newPassword').focus();
      }
    });

    document.getElementById('newPassword').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        document.getElementById('confirmPassword').focus();
      }
    });

    document.getElementById('confirmPassword').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        resetPassword();
      }
    });
  </script>
</body>
</html>
